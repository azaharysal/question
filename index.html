<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>¿Quieres ser nuestro testigo?</title>
<meta name="description" content="Azahar & Sal — 3 de octubre de 2026, Isla de León. Una pregunta antes de la boda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef2ef;
    --ink: #3f5a4d;
    --ink-soft: #5c7b6c;
    --accent: #6c8f83;
    --lav: #9487a8;
    --blush: #c48d90;
    --paper: #fffdfa;
    --invite-grey: #525252;
    --card-shadow: 0 30px 60px -20px rgba(40,60,55,0.35), 0 8px 20px -8px rgba(40,60,55,0.25);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
  }
  body{
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    isolation:isolate;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 8% 4%, rgba(120,160,175,0.16), transparent 60%),
      radial-gradient(ellipse 55% 42% at 96% 10%, rgba(150,140,120,0.13), transparent 60%),
      radial-gradient(ellipse 60% 50% at 6% 100%, rgba(148,138,168,0.14), transparent 62%),
      radial-gradient(ellipse 55% 45% at 100% 96%, rgba(108,143,131,0.15), transparent 60%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.38;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><g fill='none' stroke='%237f9a8c' stroke-width='0.8' stroke-linecap='round' opacity='0.5'><path d='M-3 6 Q 2 2 7 6 T 17 6 T 27 6 T 37 6'/><path d='M-3 21 Q 2 17 7 21 T 17 21 T 27 21 T 37 21'/></g><g fill='%237f9a8c' opacity='0.42'><ellipse cx='5' cy='16' rx='3.2' ry='1.25' transform='rotate(-30 5 16)'/></g><g stroke='%236c8f83' stroke-width='0.35' opacity='0.48'><path d='M3 16.8 L7 15.2'/></g><g fill='%239487a8' opacity='0.4'><ellipse cx='21' cy='2' rx='2.9' ry='1.1' transform='rotate(38 21 2)'/></g><g stroke='%238678a0' stroke-width='0.35' opacity='0.44'><path d='M19.4 3.2 L22.6 0.8'/></g><g fill='%237f9a8c' opacity='0.36'><ellipse cx='25' cy='18' rx='2.7' ry='1.05' transform='rotate(-15 25 18)'/></g><g stroke='%236c8f83' stroke-width='0.35' opacity='0.4'><path d='M23.4 18.7 L26.6 17.3'/></g><g fill='%239487a8' opacity='0.34'><ellipse cx='12' cy='11' rx='2.5' ry='1' transform='rotate(60 12 11)'/></g><g stroke='%238678a0' stroke-width='0.35' opacity='0.38'><path d='M10.9 9.2 L13.1 12.8'/></g><g fill='%237f9a8c' opacity='0.32'><ellipse cx='18' cy='26' rx='2.3' ry='0.9' transform='rotate(-42 18 26)'/></g><g stroke='%236c8f83' stroke-width='0.3' opacity='0.36'><path d='M16.6 27.2 L19.4 24.8'/></g><g fill='%239487a8' opacity='0.32'><ellipse cx='0' cy='27' rx='2.2' ry='0.85' transform='rotate(20 0 27)'/></g><g fill='%237f9a8c' opacity='0.28'><ellipse cx='29' cy='12' rx='2' ry='0.8' transform='rotate(-50 29 12)'/></g><g fill='%238678a0' opacity='0.3'><ellipse cx='9' cy='24' rx='1.9' ry='0.75' transform='rotate(10 9 24)'/></g><g fill='%236c8f83' opacity='0.3'><ellipse cx='27' cy='27' rx='1.8' ry='0.7' transform='rotate(-25 27 27)'/></g></svg>");
    background-size:30px 30px;
  }

  .screen{
    width:100%;
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    max-width:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
    position:relative;
    z-index:1;
  }

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background: var(--paper);
    border-radius: 22px;
    box-shadow: var(--card-shadow);
    padding: 40px 18px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:16px;
  }

  .mark{
    width:78px;
    height:auto;
    flex:0 0 auto;
  }
  .mark.small{
    width:56px;
  }

  h1{
    margin:0;
    font-family:'Mr Dafoe', cursive;
    font-weight:400;
    font-style:normal;
    font-size:clamp(44px, 14vw, 64px);
    line-height:1.1;
    color: var(--invite-grey);
    white-space: nowrap;
  }

  p.copy{
    margin:0;
    font-size:13.5px;
    line-height:1.6;
    color: var(--ink-soft);
    max-width:28ch;
  }

  .date-pill{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.03em;
    color: var(--ink);
    background: rgba(108,143,131,0.12);
    border: 1px solid rgba(108,143,131,0.28);
    padding:6px 14px;
    border-radius:999px;
  }

  .btn-yes{
    margin-top:8px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.03em;
    color:#fff;
    background: linear-gradient(135deg, var(--accent), var(--ink));
    border:none;
    padding:15px 46px;
    border-radius:999px;
    cursor:pointer;
    box-shadow: 0 14px 28px -10px rgba(63,90,77,0.55);
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, box-shadow .18s ease, opacity .3s ease;
  }
  .btn-yes:active{
    transform: scale(0.96);
    box-shadow: 0 8px 18px -8px rgba(63,90,77,0.5);
  }

  .ask{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .card.answered .ask{
    display:none;
  }
  .thanks{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .card.answered .thanks{
    display:flex;
  }
  .thanks .mark{
    animation: pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{
    0%{ transform: scale(0); }
    70%{ transform: scale(1.15); }
    100%{ transform: scale(1); }
  }
  /* Mr Dafoe leans hard to the right by design; a counter-skew stands it
     up straighter so it reads less slanted. */
  h1, .thanks h2{
    transform: skewX(14deg);
    white-space: nowrap;
    max-width:100%;
  }
  .ask, .thanks{
    width:100%;
  }
  .thanks h2{
    margin:0;
    font-family:'Mr Dafoe', cursive;
    font-weight:400;
    font-style:normal;
    font-size:clamp(40px, 12.5vw, 58px);
    line-height:1.1;
    color: var(--invite-grey);
  }
  .thanks p{
    margin:0;
    font-size:12.5px;
    line-height:1.6;
    color: var(--ink-soft);
    max-width:30ch;
  }

  .confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:0;
    left:0;
    will-change: transform, opacity;
  }

  @media (prefers-reduced-motion: reduce){
    .thanks .mark{ animation:none; }
    .petal{ display:none; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="card" id="card">

    <div class="ask">
      <img class="mark" src="logo_mark.png" alt="" aria-hidden="true">
      <h1>¿Quieres ser nuestro testigo?</h1>
      <p class="copy">Firma aquí, cero letra pequeña.</p>
      <span class="date-pill">3 oct · Isla de León</span>
      <button class="btn-yes" id="btnYes" type="button">Sí, quiero</button>
    </div>

    <div class="thanks">
      <h2>Gracias por compartir nuestro caos</h2>
      <p>Nos vemos el 3 de octubre.<br>Anillo no hace falta.</p>
    </div>

  </div>
</div>

<div class="confetti-layer" id="confetti"></div>

<script>
(function(){
  var card = document.getElementById('card');
  var btn = document.getElementById('btnYes');
  var layer = document.getElementById('confetti');
  var answered = false;

  // Keep the question on one line whatever font actually loads: shrink it
  // step by step until it stops overflowing its own row.
  function fitOneLine(el){
    if (!el) return;
    var tries = 0;
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && tries < 30 && size > 16){
      size -= 1;
      el.style.fontSize = size + 'px';
      tries++;
    }
  }
  var h1El = document.querySelector('h1');
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ fitOneLine(h1El); });
  }
  window.addEventListener('load', function(){ fitOneLine(h1El); });
  fitOneLine(h1El);

  // Confeti de carnaval: trocitos de papel de toda la vida — tiras y
  // redonditos en colores saturados, como los que caen en el Carnaval de Cádiz.
  // Each piece is a little free-falling body (gravity + sideways drift +
  // its own sway and flip rhythm) driven frame by frame, not a shared
  // choreographed keyframe — that's what keeps the fall looking chaotic
  // instead of staged, since no two pieces ever move in lockstep.
  var confettiColors = ['#e6484f', '#f4c542', '#3f8fd1', '#e666a0', '#4caf7d', '#9b59c9', '#f0923a'];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var particles = [];
  var rafId = null;

  function spawnParticle(){
    var el = document.createElement('div');
    el.className = 'petal';

    var color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    var isRound = Math.random() < 0.4;
    var w, h;
    if (isRound){
      w = h = 3.5 + Math.random() * 3.5;
    } else {
      w = 3 + Math.random() * 2.5;
      h = 5.5 + Math.random() * 5;
    }
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.background = color;
    el.style.borderRadius = isRound ? '50%' : '1px';
    el.style.boxShadow = '0 1px 2px rgba(40,60,55,0.12), inset 0 0 0 1px rgba(255,255,255,0.28)';
    layer.appendChild(el);

    var vh = window.innerHeight;
    particles.push({
      el: el,
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * vh * 0.5,
      vx: (Math.random() * 2 - 1) * 50,
      vy: 40 + Math.random() * 70,
      gravity: 55 + Math.random() * 55,
      drag: 0.15 + Math.random() * 0.25,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() * 2 - 1) * 300,
      swayAmp: 14 + Math.random() * 46,
      swayFreq: 0.35 + Math.random() * 1.1,
      swayPhase: Math.random() * Math.PI * 2,
      flipFreq: 1 + Math.random() * 2.4,
      flipPhase: Math.random() * Math.PI * 2,
      born: performance.now(),
      fadeStart: 3.4 + Math.random() * 1.6,
      fadeDur: 0.7 + Math.random() * 0.5
    });
  }

  function tick(now){
    var vh = window.innerHeight;
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      var t = (now - p.born) / 1000;
      if (t < 0) continue;

      p.vy += p.gravity * (1/60);
      var settle = Math.max(0.35, 1 - p.drag * t);
      var sway = Math.sin(t * p.swayFreq * Math.PI * 2 + p.swayPhase) * p.swayAmp * settle;
      var x = p.x + p.vx * t * settle + sway;
      var y = p.y + p.vy * t + 0.5 * p.gravity * t * t;
      var rot = p.rot + p.rotSpeed * t * (0.6 + 0.4 * settle);
      var flip = Math.cos(t * p.flipFreq * Math.PI * 2 + p.flipPhase);
      var scaleY = 0.22 + Math.abs(flip) * 0.78;

      var opacity = 1;
      if (t > p.fadeStart){
        opacity = Math.max(0, 1 - (t - p.fadeStart) / p.fadeDur);
      }

      if (y > vh + 30 || opacity <= 0){
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        particles.splice(i, 1);
        continue;
      }

      p.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg) scaleY(' + scaleY.toFixed(2) + ')';
      p.el.style.opacity = opacity.toFixed(2);
    }

    if (particles.length > 0){
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
    }
  }

  function burstConfetti(){
    if (reduceMotion) return;
    var total = 260;
    var spawned = 0;

    function spawnBatch(){
      var n = 10 + Math.floor(Math.random() * 14);
      for (var i = 0; i < n && spawned < total; i++, spawned++){
        spawnParticle();
      }
      if (spawned < total){
        setTimeout(spawnBatch, 25 + Math.random() * 70);
      }
    }
    spawnBatch();

    if (rafId === null){
      rafId = requestAnimationFrame(tick);
    }
  }

  function answerYes(){
    if (answered) return;
    answered = true;
    card.classList.add('answered');
    fitOneLine(document.querySelector('.thanks h2'));
    burstConfetti();
    try {
      if (navigator.vibrate) navigator.vibrate(30);
    } catch(err){}
  }

  btn.addEventListener('click', answerYes);
})();
</script>
</body>
</html>
